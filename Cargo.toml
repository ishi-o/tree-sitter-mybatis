[package]
name = "tree-sitter-mybatis"
description = "Tree-sitter grammar for MyBatis and iBATIS mapper files"
version = "0.1.0"
authors = ["ishi-o <458457289@qq.com>"]
license = "MIT"
readme = "README.md"
keywords = ["tree-sitter", "mybatis", "ibatis", "sql", "xml"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/ishi-o/tree-sitter-mybatis"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/**/*",
  "grammar.js",
  "queries/**/*",
  "src/**/*",
  "tree-sitter.json",
  "README.md",
  "LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"
