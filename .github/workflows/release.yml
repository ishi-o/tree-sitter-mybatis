name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tree-sitter CLI
        run: cargo install tree-sitter-cli --version 0.25.10 --locked

      - name: Generate parser
        run: tree-sitter generate

      - name: Run grammar tests
        run: tree-sitter test

      - name: Check generated files
        run: git diff --exit-code -- src/grammar.json src/node-types.json src/parser.c

      - name: Run Rust tests
        run: cargo test

      - name: Verify release versions
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          npm_version="$(jq -r '.version' package.json)"
          tree_sitter_version="$(jq -r '.metadata.version' tree-sitter.json)"

          test "$tag_version" = "$cargo_version"
          test "$tag_version" = "$npm_version"
          test "$tag_version" = "$tree_sitter_version"

      - name: Package Rust crate
        run: cargo package --allow-dirty

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" target/package/*.crate --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
